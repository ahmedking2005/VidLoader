name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'keystore.enc.b64'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore signing keystore (decrypt committed blob)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          base64 -d keystore.enc.b64 | openssl enc -d -aes-256-cbc -salt -pbkdf2 -pass env:KEYSTORE_PASSWORD -out vidloader-release.keystore
          keytool -list -keystore vidloader-release.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null
          {
            echo "storeFile=vidloader-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Stage APK
        run: cp app/build/outputs/apk/release/app-release.apk VidLoader.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VidLoader v1.0.${{ github.run_number }}
          files: VidLoader.apk
